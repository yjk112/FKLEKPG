input {
  kafka {
    bootstrap_servers => "192.168.189.134:9092"
    topics => ["nginx-access"]
    group_id => "logstash-nginx-group"
    auto_offset_reset => "earliest"
    codec => json
    consumer_threads => 2
  }
}

filter {
  # 时区校正，使用日志里的 time 字段覆盖 @timestamp
  date {
    match => [ "[time]", "yyyy-MM-dd'T'HH:mm:ss+08:00" ]
    target => "@timestamp"
  }
  # 把状态码转数字，方便统计
  mutate {
    convert => { "status" => "integer" }
  }
}

output {
  elasticsearch {
    hosts => ["http://192.168.189.131:9200"]
    index => "nginx-access-%{+YYYY.MM.dd}"
  }
   stdout { codec => rubydebug }
}

